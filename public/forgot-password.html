<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - YouTube Auto-Comment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: white;
        }

        .brand-text {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h4 class="text-center mb-4"><span class="brand-text">YOUTUBE</span> Auto-Comment</h4>
        <h5 class="text-center mb-4 text-muted">Reset Password</h5>

        <div class="alert alert-info">
            Enter your email address and we'll send you a link to reset your password.
        </div>

        <form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" disabled>Send Reset Link (Coming Soon)</button>
        </form>

        <div class="text-center mt-3">
            <small><a href="/login">Back to Login</a></small>
        </div>
    </div>
</body>

</html>
