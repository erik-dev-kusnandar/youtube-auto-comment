<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Auto Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-3">YouTube Auto-Comment Dashboard</h1>

      <div class="row">
        <div class="col-md-6">
          <div class="card mb-3">
            <div class="card-header">Upload Video List (CSV)</div>
            <div class="card-body">
              <form id="uploadVideosForm">
                <input class="form-control mb-2" type="file" id="videosFile" accept=".csv" />
                <button class="btn btn-primary" type="submit">Upload Videos</button>
              </form>
              <small class="text-muted">CSV header: video_url (or videoId)</small>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-header">Upload Comment List (CSV)</div>
            <div class="card-body">
              <form id="uploadCommentsForm">
                <input class="form-control mb-2" type="file" id="commentsFile" accept=".csv" />
                <button class="btn btn-primary" type="submit">Upload Comments</button>
              </form>
              <small class="text-muted">CSV header: comment_text</small>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button id="startBtn" class="btn btn-success btn-lg">Start Posting Comments</button>
            <button id="refreshBtn" class="btn btn-secondary">Refresh Progress</button>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card mb-3">
            <div class="card-header">Live Log</div>
            <div class="card-body" style="height: 300px; overflow:auto;" id="logBox"></div>
          </div>

          <div class="card">
            <div class="card-header">Progress</div>
            <div class="card-body">
              <table class="table table-sm" id="progressTable">
                <thead><tr><th>Video</th><th>VideoId</th><th>Status</th><th>Comment</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <footer class="mt-4 text-muted">Built by Sahabat · Node.js</footer>
    </div>

    <script src="/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
